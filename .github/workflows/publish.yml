name: Sync ESPN and publish dashboard
on:
  workflow_dispatch:
    inputs:
      refresh_espn:
        description: Fetch fresh ESPN data (disable to republish the existing snapshot)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: fantasy-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch league snapshot
        if: ${{ inputs.refresh_espn }}
        run: python scripts/sync.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID || '618015977' }}
          ESPN_TEAM_ID: ${{ vars.ESPN_TEAM_ID || '2' }}
          ESPN_SEASON: ${{ vars.ESPN_SEASON || '2027' }}
      - name: Preserve published snapshot without contacting ESPN
        if: ${{ !inputs.refresh_espn }}
        run: curl --fail --silent --show-error --max-time 30 https://b-jacobe.github.io/nba-fantasy-dashboard/data/league.json -o site/data/league.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
